<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chelfe</title>
  <!-- the shelf's look is reused; popup.css adds the box frame + save bar -->
  <link rel="stylesheet" href="../shelf/shelf.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="chelfe-popup">

  <header class="box-head">
    <img id="boxLogo" class="box-logo" src="../icons/icon48.png" alt="" />
    <div class="box-title">
      <h1>Chelfe</h1>
      <p id="count" class="count"></p>
    </div>
    <button id="sound" class="sound" type="button"
            title="Wormy's voice" aria-label="Wormy's voice" aria-pressed="true">
      <svg class="snd-on" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
        <path d="M4 9h3l4-3v12l-4-3H4z" fill="currentColor"/>
        <path d="M14.5 9a4 4 0 0 1 0 6M17.2 6.6a7.5 7.5 0 0 1 0 10.8" fill="none"
              stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      </svg>
      <svg class="snd-off" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
        <path d="M4 9h3l4-3v12l-4-3H4z" fill="currentColor"/>
        <path d="M14 9.5l5 5M19 9.5l-5 5" fill="none"
              stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      </svg>
    </button>
    <button id="expand" class="expand" type="button"
            title="Open the full shelf in a tab" aria-label="Open the full shelf in a tab">⤢</button>
  </header>

  <!-- save this page -->
  <section class="save">
    <button id="saveToggle" class="save-toggle" type="button" aria-expanded="false">
      <span class="plus" aria-hidden="true">+</span>
      <span>Save this page</span>
    </button>

    <div id="savePanel" class="save-panel" hidden>
      <p id="savePage" class="save-page"></p>

      <div class="field">
        <span class="field-label">How long will it take?</span>
        <div id="minutes" class="chips">
          <button type="button" class="chip" data-min="5">5 min</button>
          <button type="button" class="chip is-on" data-min="20">20 min</button>
          <button type="button" class="chip" data-min="60">1h+</button>
        </div>
      </div>

      <div class="field">
        <span class="field-label">Remind me</span>
        <div id="remind" class="chips">
          <button type="button" class="chip" data-remind="tomorrow">Tomorrow</button>
          <button type="button" class="chip" data-remind="weekend">Weekend</button>
          <button type="button" class="chip" data-remind="twoweeks">2 weeks</button>
          <button type="button" class="chip" data-remind="date">Date</button>
          <button type="button" class="chip is-on" data-remind="none">None</button>
        </div>
        <input id="date" class="date" type="date" hidden />
      </div>

      <p id="warn" class="warn" hidden></p>
      <button id="save" class="save-btn" type="button">Put on the shelf</button>
      <p id="toast" class="toast" hidden></p>
    </div>
  </section>

  <!-- the shelf -->
  <main id="shelf" class="box-shelf" aria-live="polite"></main>

  <div id="empty" class="box-empty" hidden>
    <svg class="spider" width="66" height="53" viewBox="0 0 90 72" aria-hidden="true">
      <g stroke="#2b2118" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M33 36 C20 28, 14 32, 8 42"/>
        <path d="M33 41 C18 42, 12 48, 6 56"/>
        <path d="M34 46 C22 52, 18 58, 14 66"/>
        <path d="M38 48 C32 58, 30 62, 30 69"/>
        <path d="M57 36 C70 28, 76 32, 82 42"/>
        <path d="M57 41 C72 42, 78 48, 84 56"/>
        <path d="M56 46 C68 52, 72 58, 76 66"/>
        <path d="M52 48 C58 58, 60 62, 60 69"/>
      </g>
      <ellipse cx="45" cy="42" rx="13" ry="11" fill="#2b2118"/>
      <circle cx="45" cy="29" r="7" fill="#3a2c1e"/>
      <circle cx="42" cy="27" r="2" fill="#f6ead6"/>
      <circle cx="48" cy="27" r="2" fill="#f6ead6"/>
    </svg>
    <p class="empty-text">Nothing here yet.<br />Save a page, yallah.</p>
  </div>

  <!-- Wormy, docked at the bottom -->
  <footer id="wormy" class="wormy box-wormy" data-mood="happy">
    <div id="wormyBubble" class="bubble" role="status" aria-live="polite"
         title="Tap me to hear Wormy say it"></div>
    <button id="wormyFigure" class="wormy-figure" type="button" aria-label="Talk to Wormy"></button>
    <div id="wormyConfetti" class="confetti" aria-hidden="true"></div>
  </footer>

  <!-- item detail card -->
  <div id="backdrop" class="backdrop" hidden></div>
  <div id="card" class="card" hidden role="dialog" aria-modal="true">
    <button id="cardClose" class="card-close" type="button" aria-label="Close">×</button>
    <img id="cardFavicon" class="card-favicon" alt="" />
    <h2 id="cardTitle" class="card-title"></h2>
    <p id="cardMeta" class="card-meta"></p>
    <p id="cardRemind" class="card-remind" hidden></p>
    <div class="card-actions">
      <button id="cardOpen" type="button">Open</button>
      <button id="cardDone" type="button">Done</button>
      <button id="cardRemove" type="button">Remove</button>
    </div>
  </div>

  <!-- reused bit -->
  <template id="tpl-cobweb">
    <svg class="cobweb" viewBox="0 0 44 44" aria-hidden="true">
      <g fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.3" stroke-linecap="round">
        <path d="M2 2 L42 14 M2 2 L14 42 M2 2 L34 34" />
        <path d="M15 7 Q11 15 7 17" />
        <path d="M26 10 Q20 23 10 26" />
        <path d="M36 13 Q28 32 13 36" />
      </g>
    </svg>
  </template>

  <script src="../lib/storage.js"></script>
  <script src="../lib/dust.js"></script>
  <script src="../lib/wormy.js"></script>
  <script src="../lib/sound.js"></script>
  <script src="popup.js"></script>
</body>
</html>
