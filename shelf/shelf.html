<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chelfe — My Shelf</title>
  <link rel="stylesheet" href="shelf.css" />
</head>
<body>
  <header class="topbar">
    <h1>🪱 Chelfe</h1>
    <div class="topbar-right">
      <span id="count" class="count"></span>
      <button id="sound" class="sound" type="button"
              title="Wormy's voice" aria-label="Wormy's voice" aria-pressed="true">
        <svg class="snd-on" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
          <path d="M4 9h3l4-3v12l-4-3H4z" fill="currentColor"/>
          <path d="M14.5 9a4 4 0 0 1 0 6M17.2 6.6a7.5 7.5 0 0 1 0 10.8" fill="none"
                stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
        <svg class="snd-off" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
          <path d="M4 9h3l4-3v12l-4-3H4z" fill="currentColor"/>
          <path d="M14 9.5l5 5M19 9.5l-5 5" fill="none"
                stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- planks are injected here by shelf.js -->
  <main id="shelf" class="shelf" aria-live="polite"></main>

  <!-- empty state -->
  <div id="empty" class="empty" hidden>
    <div class="plank">
      <div class="row empty-row">
        <svg class="spider" width="90" height="72" viewBox="0 0 90 72" aria-hidden="true">
          <g stroke="#2b2118" stroke-width="3" stroke-linecap="round" fill="none">
            <path d="M33 36 C20 28, 14 32, 8 42"/>
            <path d="M33 41 C18 42, 12 48, 6 56"/>
            <path d="M34 46 C22 52, 18 58, 14 66"/>
            <path d="M38 48 C32 58, 30 62, 30 69"/>
            <path d="M57 36 C70 28, 76 32, 82 42"/>
            <path d="M57 41 C72 42, 78 48, 84 56"/>
            <path d="M56 46 C68 52, 72 58, 76 66"/>
            <path d="M52 48 C58 58, 60 62, 60 69"/>
          </g>
          <ellipse cx="45" cy="42" rx="13" ry="11" fill="#2b2118"/>
          <circle cx="45" cy="29" r="7" fill="#3a2c1e"/>
          <circle cx="42" cy="27" r="2" fill="#f6ead6"/>
          <circle cx="48" cy="27" r="2" fill="#f6ead6"/>
        </svg>
      </div>
    </div>
    <p class="empty-text">Nothing here. Suspicious.</p>
  </div>

  <!-- item detail card -->
  <div id="backdrop" class="backdrop" hidden></div>
  <div id="card" class="card" hidden role="dialog" aria-modal="true">
    <button id="cardClose" class="card-close" type="button" aria-label="Close">×</button>
    <img id="cardFavicon" class="card-favicon" alt="" />
    <h2 id="cardTitle" class="card-title"></h2>
    <p id="cardMeta" class="card-meta"></p>
    <p id="cardRemind" class="card-remind" hidden></p>
    <div class="card-actions">
      <button id="cardOpen" type="button">Open</button>
      <button id="cardDone" type="button">Done</button>
      <button id="cardRemove" type="button">Remove</button>
    </div>
  </div>

  <!-- Wormy, the librarian (bottom-left) -->
  <div id="wormy" class="wormy" data-mood="happy">
    <div id="wormyBubble" class="bubble" role="status" aria-live="polite"></div>
    <button id="wormyFigure" class="wormy-figure" type="button" aria-label="Talk to Wormy"></button>
    <div id="wormyConfetti" class="confetti" aria-hidden="true"></div>
  </div>

  <!-- reused bits -->
  <template id="tpl-cobweb">
    <svg class="cobweb" viewBox="0 0 44 44" aria-hidden="true">
      <g fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.3" stroke-linecap="round">
        <path d="M2 2 L42 14 M2 2 L14 42 M2 2 L34 34" />
        <path d="M15 7 Q11 15 7 17" />
        <path d="M26 10 Q20 23 10 26" />
        <path d="M36 13 Q28 32 13 36" />
      </g>
    </svg>
  </template>

  <script src="../lib/storage.js"></script>
  <script src="../lib/dust.js"></script>
  <script src="../lib/wormy.js"></script>
  <script src="../lib/sound.js"></script>
  <script src="shelf.js"></script>

</body>
</html>
